# One-click release: Actions → Release → Run workflow.
# Builds the Windows and/or macOS installers and publishes them as a GitHub Release.
# Needs the GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets, and the updater's
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (see docs/development.md).
name: Release
run-name: Release (${{ inputs.version || inputs.bump }}, ${{ inputs.platforms }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Raise the last released version: patch for fixes (1.2.3 → 1.2.4), minor for new features (→ 1.3.0), major (→ 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or enter an exact version instead, e.g. 0.2.0. Leave empty to use the choice above.
        required: false
        type: string
      platforms:
        description: "Installers to build. Users of a platform left out don't get this update until a release includes it."
        type: choice
        options: [Windows and macOS, Windows, macOS]
        default: Windows and macOS

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add the GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets first (see docs/development.md)."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the updater's TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) repository secrets first (see docs/development.md)."
            exit 1
          fi

      - name: Choose platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          windows='{"name": "Windows", "os": "windows-latest", "args": "", "rust-targets": ""}'
          # One universal .dmg for Apple Silicon and Intel Macs.
          macos='{"name": "macOS", "os": "macos-latest", "args": "--target universal-apple-darwin", "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin"}'
          case "$PLATFORMS" in
            Windows) matrix="[$windows]" ;;
            macOS) matrix="[$macos]" ;;
            *) matrix="[$windows, $macos]" ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          next=$(node scripts/next-version.mjs "$BUMP" "$EXACT")
          echo "$next" >> "$GITHUB_OUTPUT"
          version=$(echo "$next" | sed -n 's/^version=//p')
          last=$(echo "$next" | sed -n 's/^last=//p')
          # After a failed run package.json may already have this version.
          if [ "$version" != "$(node -p "require('./package.json').version")" ]; then
            node scripts/set-version.mjs "$version"
          fi
          # CHANGELOG.md's Unreleased notes become this version's; the version commit includes it.
          node scripts/changelog.mjs "$version" > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::warning::CHANGELOG.md has nothing under Unreleased, so this release has no What's new."
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version** (last release: v$last)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version change
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # Whoever started the release authors its commit, through their private
          # noreply address: it counts as theirs, and no bot joins the contributors.
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if ! git diff --quiet; then
            git config user.name "$ACTOR"
            git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
            git commit -am "Release $TAG"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          PLATFORMS: ${{ inputs.platforms }}
          NOTES: ${{ runner.temp }}/notes.md
        with:
          script: |
            const { TAG: tag, SHA: sha, PLATFORMS: platforms } = process.env;
            const notes = require('fs').readFileSync(process.env.NOTES, 'utf8').trim();
            // A draft left behind by a failed run is replaced.
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            for (const old of releases.filter((r) => r.draft && r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: old.id });
            }
            // Only mention the platforms this release has installers for.
            const windows = platforms !== 'macOS';
            const macos = platforms !== 'Windows';
            const body = [
              ...(notes ? ['## What\'s new', notes, ''] : []),
              '## Download',
              ...(windows ? ['- **Windows:** the `.exe` installer (or the `.msi`)'] : []),
              ...(macos ? ['- **macOS** (Apple Silicon and Intel): the `.dmg`'] : []),
              '',
              'The app isn\'t code-signed yet, so the first launch shows a warning:',
              ...(windows ? ['- **Windows:** "Windows protected your PC" → **More info** → **Run anyway**'] : []),
              ...(macos ? ['- **macOS:** open the app once, then **System Settings → Privacy & Security → Open Anyway**'] : []),
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: sha,
              name: `Unified Mail ${tag}`,
              body,
              draft: true,
            });
            core.setOutput('id', data.id);

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # The platforms chosen in the Prepare job.
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by src-tauri/build.rs and baked into the app.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Signs the update files, which installed apps check against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # tauri.release.conf.json turns on the signed update files, only here, so local builds
          # don't need the key. The action merges both jobs' entries into one latest.json.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          # The generic windows-x86_64 entry of latest.json is the NSIS installer, like the README's download.
          updaterJsonPreferNsis: true
          # The signatures are copied into latest.json, which is all the updater reads, so the
          # separate .sig files would only clutter the downloads.
          uploadUpdaterSignatures: false

  # Publish only when every installer built, so a release is never half-empty.
  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const { data } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
            await core.summary.addRaw(`Published [${data.name}](${data.html_url})`, true).write();
