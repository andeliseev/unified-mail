  </defs>
  <rect x="2" y="2" width="20" height="20" rx="5" fill="#2f6df6"/>
  <path d="M1 2.4L12 10.4L23 2.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#inside)"/>
</svg>
