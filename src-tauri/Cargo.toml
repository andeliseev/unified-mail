[package]
name = "unified-mail"
version = "0.2.1"
description = "Unified inbox for Gmail accounts"
license = "MIT"
repository = "https://github.com/andeliseev/unified-mail"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.13, like tauri-plugin-updater, so the app has one copy. native-tls: the OS's TLS (SChannel / Secure Transport).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "gzip", "http2", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "sync"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
url = "2"
open = "5"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Default features add rustls (a second TLS stack) and zip (only for old zipped Windows updates): +1.4 MB.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

# macOS: the webview passes right-clicks and keys in the email on to the page, the page learns
# when the window goes full screen, and saved attachments get macOS's quarantine mark (macos.rs).
# Tauri already builds these crates with these features, so they add no new dependency.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSUserInterfaceItemIdentification", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }

# Size-focused release build: https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
