[package]
name = "unified-mail"
version = "0.1.1"
description = "Unified inbox for Gmail accounts"
license = "MIT"
repository = "https://github.com/andeliseev/unified-mail"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "http2", "default-tls", "macos-system-configuration"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
url = "2"
open = "5"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Size-focused release build: https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
